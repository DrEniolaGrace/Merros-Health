# Local development stack (default): `docker compose up --build`
#   postgres  PostgreSQL 16 with pgvector, data kept in the "pgdata" volume
#   migrate   applies Prisma migrations, seeds synthetic personas if the database is empty, then exits
#   web       the Meros app on http://localhost:3000
#
# Secrets (encryption master key, session secret, lab keys) come from .env (see .env.example).
# DATABASE_URL / DIRECT_URL in .env are overridden here so the containers use the local Postgres;
# .env can keep the Neon URLs for the Neon fallback (`pnpm dev`).

x-db-env: &db-env
  DATABASE_URL: postgresql://meros:meros@postgres:5432/meros
  DIRECT_URL: postgresql://meros:meros@postgres:5432/meros

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: meros
      POSTGRES_PASSWORD: meros
      POSTGRES_DB: meros
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meros -d meros"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: tools
    env_file: .env
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    env_file: .env
    environment: *db-env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Phase 5: Risk Beyond the Panel genomics service (Python FastAPI, bcftools, PLINK, KING).
  # genomics:
  #   build: ./services/genomics
  #   ports:
  #     - "8000:8000"

volumes:
  pgdata:

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit tests: risk engine, escalation, consent, signatures, encryption, audit chain, PSI,
      # Safety Verifier and the Copilot pipeline. None need a database or an AI key.
      - run: pnpm test
      # Copilot evaluation harness on the golden set with the offline provider (no key needed).
      # Fails the build if any safety check fails or the pass rate drops below 90%.
      - run: pnpm eval
        env:
          EVAL_PROVIDER: mock
      - uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation
          path: docs/AI_EVALUATION.md
